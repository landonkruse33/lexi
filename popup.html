<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexi - Text Prediction Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <header class="popup-header">
            <div class="logo">
                <img src="icons/icon48.png" alt="Lexi" class="logo-icon">
                <h1>Lexi</h1>
            </div>
            <div class="tagline">AI Text Prediction</div>
        </header>

        <main class="popup-main">
            <!-- Toggle Section -->
            <section class="section">
                <div class="toggle-container">
                    <label class="toggle-label">
                        <input type="checkbox" id="enableToggle" class="toggle-input">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Enable Lexi</span>
                    </label>
                </div>
            </section>

            <!-- Settings Section -->
            <section class="section">
                <h2>Prediction Settings</h2>
                
                <div class="setting-group">
                    <label for="predictionKey">Prediction Key:</label>
                    <select id="predictionKey" class="select-input">
                        <option value="Tab">Tab</option>
                        <option value="Enter">Enter</option>
                        <option value="Space">Space</option>
                        <option value="Ctrl+Space">Ctrl + Space</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="displayMode">Display Mode:</label>
                    <select id="displayMode" class="select-input">
                        <option value="inline">Inline</option>
                        <option value="floating">Floating</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="predictionColor">Prediction Color:</label>
                    <div class="color-input-container">
                        <input type="color" id="predictionColor" class="color-input" value="#007acc">
                        <span id="colorHex" class="color-hex">#007acc</span>
                    </div>
                </div>
            </section>

            <!-- Model Stats Section -->
            <section class="section">
                <h2>Model Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="vocabSize">0</div>
                        <div class="stat-label">Vocabulary Size</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="trigramCount">0</div>
                        <div class="stat-label">Trigrams</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="bigramCount">0</div>
                        <div class="stat-label">Bigrams</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalWords">0</div>
                        <div class="stat-label">Total Words</div>
                    </div>
                </div>
                <button id="refreshStats" class="button secondary">Refresh Stats</button>
            </section>

            <!-- Model Management Section -->
            <section class="section">
                <h2>Model Management</h2>
                
                <div class="button-group">
                    <button id="trainModel" class="button primary">Train on Current Tab</button>
                    <button id="resetModel" class="button danger">Reset Model</button>
                </div>

                <div class="file-actions">
                    <button id="exportModel" class="button secondary">
                        <span class="button-icon">\ud83d\udce5</span>
                        Export Model
                    </button>
                    <label for="importModel" class="button secondary">
                        <span class="button-icon">\ud83d\udce4</span>
                        Import Model
                    </label>
                    <input type="file" id="importModel" accept=".json" style="display: none;">
                </div>
            </section>

            <!-- Test Section -->
            <section class="section">
                <h2>Test Prediction</h2>
                <div class="test-container">
                    <input type="text" id="testInput" class="test-input" placeholder="Type something to test predictions...">
                    <div class="test-result">
                        <span class="result-label">Prediction:</span>
                        <span id="testResult" class="result-value">-</span>
                    </div>
                </div>
            </section>
        </main>

        <footer class="popup-footer">
            <div class="version">Version 1.0.0</div>
            <div class="links">
                <a href="#" id="helpLink" class="link">Help</a>
                <a href="#" id="aboutLink" class="link">About</a>
            </div>
        </footer>
    </div>

    <!-- Status Messages -->
    <div id="statusMessage" class="status-message"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Processing...</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
